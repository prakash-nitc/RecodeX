<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rxc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#707881" />
      <stop offset="100%" stop-color="#202833" />
    </linearGradient>
    <linearGradient id="rxc-sun" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF963D" />
      <stop offset="100%" stop-color="#FFD27A" />
    </linearGradient>
  </defs>
  <rect id="bg" width="64" height="64" rx="15" fill="url(#rxc-bg)" />
  <g id="art">
    <!-- code brackets: < … > -->
    <path d="M12.5 24 L6 33 L12.5 42" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M51.5 24 L58 33 L51.5 42" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- sunrise between the peaks: mastery -->
    <circle cx="37" cy="21.5" r="5.6" fill="url(#rxc-sun)" />
    <!-- the second, smaller peak -->
    <path d="M33 46 L41.5 31 L49.5 46 Z" fill="#AEB5BF" stroke="#AEB5BF" stroke-width="2.2" stroke-linejoin="round" />
    <!-- the summit, with its shaded face -->
    <path d="M28 21.5 L42 46 L14.5 46 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
    <path d="M28 21.5 L42 46 L33 46 L29.8 34 Z" fill="#202833" fill-opacity="0.14" />
  </g>
</svg>
