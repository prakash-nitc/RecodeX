<svg width="512" height="512" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A5CE0" />
      <stop offset="100%" stop-color="#3F2896" />
    </linearGradient>
    <linearGradient id="rx-sun" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF963D" />
      <stop offset="100%" stop-color="#FFD27A" />
    </linearGradient>
  </defs>
  <rect id="bg" width="64" height="64" rx="15" fill="url(#rx-bg)" />
  <g id="art">
    <!-- code brackets: < … > -->
    <path d="M12.5 24 L6 33 L12.5 42" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M51.5 24 L58 33 L51.5 42" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- sunrise between the peaks: mastery -->
    <circle cx="37" cy="21.5" r="5.6" fill="url(#rx-sun)" />
    <!-- the second, smaller peak -->
    <path d="M33 46 L41.5 31 L49.5 46 Z" fill="#C9BDF3" stroke="#C9BDF3" stroke-width="2.2" stroke-linejoin="round" />
    <!-- the summit, with its shaded face -->
    <path d="M28 21.5 L42 46 L14.5 46 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
    <path d="M28 21.5 L42 46 L33 46 L29.8 34 Z" fill="#3F2896" fill-opacity="0.14" />
    <!-- the trail: a switchback whose stops widen like review intervals, ratings improving on the way up -->
    <path d="M19.8 43.7 L24.6 41.3 L22.4 36.4 L27.6 29.4" fill="none" stroke="#3F2896" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="19.8" cy="43.7" r="1.7" fill="#F0565B" />
    <circle cx="24.6" cy="41.3" r="1.7" fill="#F2A93B" />
    <circle cx="22.4" cy="36.4" r="1.7" fill="#35C98A" />
    <circle cx="27.6" cy="29.4" r="1.7" fill="#35C98A" />
  </g>
</svg>
